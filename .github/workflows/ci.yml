name: CI

# Typecheck, lint, test and build on every push to main and every pull request. The live smoke
# tests skip themselves without LIVE=1, so CI needs no keys and never spends anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor (package.json engines: >=20.3, for AbortSignal.any); 22 is current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Takes the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
