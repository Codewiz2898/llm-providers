name: CI

# Typecheck, lint, test and build on every push to main and every pull request. The live smoke
# tests skip themselves without LIVE=1, so CI needs no keys and never spends anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor (package.json engines: >=20.3, for AbortSignal.any); 22 is current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Takes the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor (python/pyproject.toml); 3.13 is current.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      # The cross-boundary tests start the REAL Node service, so it is built first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: python
      - run: python -m pytest -q
        working-directory: python
